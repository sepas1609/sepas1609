<svg width="100%" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glow Filters -->
    <filter id="greenGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="runeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradients: Gravel (Chiseled Rock, Granite, Slate) -->
    <linearGradient id="gravelDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="gravelMid" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="gravelLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Gradients: Green (Luminous Emerald, Jade, Toxic Neon) -->
    <linearGradient id="greenScale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="35%" stop-color="#10B981"/>
      <stop offset="75%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <linearGradient id="greenBelly" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="85%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>

    <linearGradient id="wingMembraneFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#059669" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#064E3B" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.96"/>
    </linearGradient>

    <linearGradient id="wingMembraneBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#064E3B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.92"/>
    </linearGradient>

    <linearGradient id="trailGrad" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cosmicStream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="15%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.22"/>
      <stop offset="85%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
  <![CDATA[
    /* Flight path traversal across 1200px screen corridor (minimal offscreen idle time) */
    @keyframes dragonTraverse {
      0% {
        transform: translate(-180px, 145px) rotate(-3deg);
      }
      20% {
        transform: translate(120px, 132px) rotate(4deg);
      }
      45% {
        transform: translate(480px, 160px) rotate(-4deg);
      }
      70% {
        transform: translate(840px, 130px) rotate(3deg);
      }
      92% {
        transform: translate(1140px, 145px) rotate(-1deg);
      }
      100% {
        transform: translate(1280px, 148px) rotate(-3deg);
      }
    }

    /* Main Foreground Wing Flap */
    @keyframes frontWingBeat {
      0% {
        transform: rotate(-36deg) scaleY(0.92) skewX(4deg);
      }
      38% {
        transform: rotate(32deg) scaleY(1.08) skewX(-6deg);
      }
      65% {
        transform: rotate(10deg) scaleY(0.98) skewX(-2deg);
      }
      100% {
        transform: rotate(-36deg) scaleY(0.92) skewX(4deg);
      }
    }

    /* Background Wing Flap (Offset phase for genuine 3D perspective) */
    @keyframes backWingBeat {
      0% {
        transform: rotate(-26deg) scaleY(0.88) skewX(3deg);
      }
      38% {
        transform: rotate(26deg) scaleY(1.02) skewX(-4deg);
      }
      65% {
        transform: rotate(6deg) scaleY(0.95) skewX(-1deg);
      }
      100% {
        transform: rotate(-26deg) scaleY(0.88) skewX(3deg);
      }
    }

    /* Serpentine Tail Undulation */
    @keyframes tailUndulate {
      0%, 100% {
        transform: rotate(-8deg) translateY(0);
      }
      35% {
        transform: rotate(12deg) translateY(3px);
      }
      70% {
        transform: rotate(-14deg) translateY(-2px);
      }
    }

    /* Dragon Head and Neck Dynamic Flex */
    @keyframes headFlex {
      0%, 100% {
        transform: rotate(0deg) translateY(0);
      }
      40% {
        transform: rotate(-3deg) translateY(-1.5px);
      }
      75% {
        transform: rotate(2deg) translateY(1px);
      }
    }

    /* Trailing Stardust and Embers */
    @keyframes emberFloat1 {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 0.95;
      }
      100% {
        transform: translate(-100px, 15px) scale(0.2);
        opacity: 0;
      }
    }

    @keyframes emberFloat2 {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 0.85;
      }
      100% {
        transform: translate(-130px, -20px) scale(0.1);
        opacity: 0;
      }
    }

    @keyframes emberFloat3 {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 0.9;
      }
      100% {
        transform: translate(-150px, 8px) scale(0.15);
        opacity: 0;
      }
    }

    @keyframes eyePulse {
      0%, 100% {
        fill: #00FF88;
        opacity: 0.95;
      }
      50% {
        fill: #A7F3D0;
        opacity: 1;
        filter: drop-shadow(0 0 3px #00FF88);
      }
    }

    @keyframes runeGlowPulse {
      0%, 100% {
        opacity: 0.75;
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 2px #00FF88);
      }
    }

    .flight-actor {
      animation: dragonTraverse 10s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      will-change: transform;
    }

    .wing-front-group {
      transform-origin: 22px 4px;
      animation: frontWingBeat 0.75s ease-in-out infinite;
      will-change: transform;
    }

    .wing-back-group {
      transform-origin: 10px 2px;
      animation: backWingBeat 0.75s ease-in-out infinite -0.15s;
      will-change: transform;
    }

    .tail-group {
      transform-origin: -45px 12px;
      animation: tailUndulate 1.5s ease-in-out infinite;
      will-change: transform;
    }

    .head-group {
      transform-origin: 40px 0px;
      animation: headFlex 1.5s ease-in-out infinite;
      will-change: transform;
    }

    .ember-1 { animation: emberFloat1 0.8s linear infinite; }
    .ember-2 { animation: emberFloat2 1.1s linear infinite 0.25s; }
    .ember-3 { animation: emberFloat3 0.95s linear infinite 0.5s; }
    .dragon-eye { animation: eyePulse 1.8s ease-in-out infinite; }
    .rune-glow { animation: runeGlowPulse 2.2s ease-in-out infinite; }
  ]]>
  </style>

  <!-- Atmospheric Flight Corridor Horizon (Ambient cosmic energy lines) -->
  <line x1="20" y1="140" x2="1180" y2="140" stroke="url(#cosmicStream)" stroke-width="1.5" stroke-dasharray="16 22" opacity="0.65"/>
  <line x1="80" y1="175" x2="1120" y2="175" stroke="url(#cosmicStream)" stroke-width="1" stroke-dasharray="8 28" opacity="0.4"/>

  <!-- ================= FLYING DRAGON RIG ================= -->
  <g class="flight-actor">

    <!-- Ethereal Trail Stream (Behind dragon) -->
    <g opacity="0.85">
      <path d="M -30 12 Q -75 20 -140 10 Q -85 6 -35 8 Z" fill="url(#trailGrad)"/>
      <path d="M -20 5 Q -65 -5 -120 2 Q -60 2 -25 4 Z" fill="url(#trailGrad)" opacity="0.6"/>
      <!-- Floating Green Spirit Embers -->
      <circle cx="-55" cy="10" r="2.5" fill="#00FF88" filter="url(#greenGlow)" class="ember-1"/>
      <circle cx="-80" cy="5" r="2" fill="#34D399" class="ember-2"/>
      <circle cx="-68" cy="18" r="1.8" fill="#6EE7B7" filter="url(#greenGlow)" class="ember-3"/>
      <circle cx="-100" cy="12" r="1.5" fill="#00FF88" class="ember-1"/>
      <circle cx="-120" cy="8" r="1.2" fill="#10B981" class="ember-2"/>
      <circle cx="-140" cy="15" r="1" fill="#34D399" class="ember-3"/>
    </g>

    <!-- BACK WING (Rendered behind body for 3D depth) -->
    <g class="wing-back-group" opacity="0.85">
      <!-- Wing Membrane -->
      <path d="M 10 2 
               C 5 -35, -5 -65, -15 -85 
               C -2 -75, 12 -60, 20 -45 
               C 30 -58, 45 -48, 52 -32 
               C 58 -42, 70 -30, 72 -15 
               C 55 -5, 35 0, 10 2 Z" 
            fill="url(#wingMembraneBack)"/>
      <!-- Wing Rock/Gravel Skeletal Spars -->
      <path d="M 10 2 Q 0 -45 -15 -85" stroke="url(#gravelDark)" stroke-width="3" stroke-linecap="round"/>
      <path d="M -2 -42 Q 10 -55 20 -45" stroke="url(#gravelDark)" stroke-width="2" stroke-linecap="round"/>
      <path d="M 15 -25 Q 35 -40 52 -32" stroke="url(#gravelDark)" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 28 -12 Q 52 -22 72 -15" stroke="url(#gravelDark)" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Subtle Wing Claw -->
      <polygon points="-15,-85 -18,-89 -12,-86" fill="#64748B"/>
    </g>

    <!-- REAR TALON / LEG (Tucked back during flight) -->
    <g transform="translate(-25, 14)">
      <!-- Gravel Thigh -->
      <path d="M 0 0 C -8 6 -14 15 -10 22 C -6 26 2 24 6 18 C 10 12 8 4 0 0 Z" fill="url(#gravelMid)"/>
      <!-- Jade Green Scales on Leg -->
      <path d="M -2 4 C -6 9 -8 16 -5 20 C -2 16 3 10 2 5 Z" fill="url(#greenScale)"/>
      <!-- Talons (Slate and Emerald Claw) -->
      <path d="M -8 22 L -15 28 L -9 24 L -13 31 L -7 25" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -15 28 L -17 29 M -13 31 L -14 33" stroke="#00FF88" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- SERPENTINE DRAGON TAIL (Undulating with rock armor) -->
    <g class="tail-group">
      <!-- Tail Flesh Base (Emerald Green) -->
      <path d="M -45 8 
               C -75 14, -105 5, -135 15 
               C -160 23, -185 10, -210 18 
               C -185 22, -160 30, -135 22 
               C -105 15, -75 22, -45 18 Z" 
            fill="url(#greenScale)"/>
      <!-- Tail Ventral Jade Plates -->
      <path d="M -45 15 
               C -75 20, -105 13, -135 21 
               C -160 28, -185 17, -210 18 
               C -185 15, -160 21, -135 15 
               C -105 7, -75 14, -45 10 Z" 
            fill="url(#greenBelly)" opacity="0.9"/>
      <!-- Gravel Armor Dorsal Plates (Jagged Slate Spines on tail) -->
      <polygon points="-55,8 -62,0 -68,8" fill="url(#gravelLight)"/>
      <polygon points="-75,9 -82,2 -88,10" fill="url(#gravelMid)"/>
      <polygon points="-95,11 -102,4 -108,12" fill="url(#gravelMid)"/>
      <polygon points="-120,13 -126,7 -132,15" fill="url(#gravelDark)"/>
      <polygon points="-145,17 -150,11 -155,18" fill="url(#gravelDark)"/>
      <polygon points="-170,16 -174,12 -178,18" fill="url(#gravelDark)"/>
      <polygon points="-192,17 -196,13 -199,18" fill="url(#gravelDark)"/>
      <!-- Tail Glaive / Blade (Chiseled Gravel Spear with Green Edge) -->
      <path d="M -208 18 L -234 12 L -223 19 L -237 26 L -212 21 Z" fill="url(#gravelMid)" stroke="#1E293B" stroke-width="1"/>
      <path d="M -234 12 L -223 19 L -237 26" stroke="#00FF88" stroke-width="1.3" filter="url(#subtleGlow)"/>
    </g>

    <!-- DRAGON MAIN TORSO (Muscular Chest and Gravel Carapace) -->
    <!-- Ventral Underbelly (Radiant Jade Scales) -->
    <path d="M -45 16 
             C -20 25, 5 28, 25 24 
             C 40 20, 52 10, 55 0 
             C 45 4, 30 10, 10 12 
             C -15 14, -35 12, -45 16 Z" 
          fill="url(#greenBelly)"/>

    <!-- Dorsal Armor Plates (Heavy Gravel Slate Carapace) -->
    <path d="M -45 8 
             C -20 0, 5 -2, 28 2 
             C 42 6, 50 12, 55 0 
             C 40 -12, 10 -15, -20 -10 
             C -35 -7, -42 2, -45 8 Z" 
          fill="url(#gravelDark)"/>

    <!-- Midbody Segmented Gravel Scales and Rock Facets -->
    <path d="M -35 4 C -20 2, 0 4, 18 8 C 0 16, -20 15, -35 4 Z" fill="url(#gravelMid)"/>
    <path d="M -15 3 C 2 3, 18 6, 32 11 C 18 18, 2 17, -15 3 Z" fill="url(#greenScale)"/>

    <!-- Dorsal Stone Spikes along Spine (Granite / Gravel) -->
    <polygon points="-40,-6 -34,-16 -28,-6" fill="url(#gravelLight)"/>
    <polygon points="-24,-8 -18,-19 -12,-8" fill="url(#gravelLight)"/>
    <polygon points="-8,-10 -2,-22 4,-10" fill="url(#gravelLight)"/>
    <polygon points="8,-8 14,-20 20,-8" fill="url(#gravelMid)"/>
    <polygon points="24,-5 30,-15 36,-5" fill="url(#gravelMid)"/>

    <!-- Glowing Ancient Runes on Gravel Armor (Bioluminescent green seams) -->
    <g class="rune-glow">
      <path d="M -26 -2 L -20 4 L -14 0" stroke="#00FF88" stroke-width="1.3" stroke-linecap="round" filter="url(#runeGlow)"/>
      <path d="M -5 1 L 2 7 L 10 2" stroke="#00FF88" stroke-width="1.3" stroke-linecap="round" filter="url(#runeGlow)"/>
      <path d="M 16 4 L 22 9 L 28 6" stroke="#00FF88" stroke-width="1.1" stroke-linecap="round" filter="url(#runeGlow)"/>
    </g>

    <!-- FRONT TALON / FORELEG (Aerodynamic high-speed flight position) -->
    <g transform="translate(18, 12)">
      <!-- Gravel Shoulder and Forearm -->
      <path d="M 0 0 C 6 4, 10 12, 8 18 C 5 22, -1 20, -4 16 C -6 12, -4 4, 0 0 Z" fill="url(#gravelMid)"/>
      <path d="M 2 4 C 5 8, 6 13, 4 17 C 2 14, 0 10, 2 4 Z" fill="url(#greenScale)"/>
      <!-- Claws -->
      <path d="M 6 18 L 12 24 L 7 21 L 10 27 L 4 22" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 12 24 L 14 25 M 10 27 L 11 29" stroke="#00FF88" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- DRAGON HEAD AND NECK -->
    <g class="head-group">
      <!-- Serpentine Neck (Emerald Scales and Slate Plating) -->
      <path d="M 32 4 
               C 42 2, 55 -5, 65 -15 
               C 60 -18, 50 -12, 40 -6 
               C 34 -2, 30 1, 32 4 Z" 
            fill="url(#gravelMid)"/>
      <path d="M 36 6 
               C 46 8, 60 4, 72 -8 
               C 68 -13, 56 -5, 42 2 
               C 38 4, 35 5, 36 6 Z" 
            fill="url(#greenScale)"/>
      <!-- Throat Underbelly -->
      <path d="M 40 8 C 52 10, 66 6, 76 -4 C 73 -6, 62 2, 48 5 Z" fill="url(#greenBelly)"/>

      <!-- Dragon Head Armor (Gravel Slate Skull) -->
      <path d="M 62 -14 
               C 70 -22, 85 -24, 98 -20 
               C 108 -16, 118 -8, 122 -4 
               C 112 -2, 105 2, 95 3 
               C 85 4, 74 -2, 68 -6 
               C 65 -9, 63 -12, 62 -14 Z" 
            fill="url(#gravelDark)"/>

      <!-- Snout and Upper Jaw (Chiseled Rock with Jade Highlights) -->
      <path d="M 90 -16 C 102 -15, 115 -10, 122 -4 C 114 -2, 104 0, 95 1 C 88 -3, 86 -10, 90 -16 Z" fill="url(#gravelMid)"/>
      
      <!-- Open Lower Jaw (Ferocious Roar) -->
      <path d="M 88 5 C 98 6, 108 5, 114 2 C 106 5, 96 10, 86 8 Z" fill="url(#gravelDark)"/>
      <path d="M 92 4 C 100 5, 108 4, 112 2 C 105 4, 98 7, 92 4 Z" fill="url(#greenScale)"/>
      <!-- Sharp Gravel/Bone Teeth -->
      <polygon points="98,-2 100,2 102,-2" fill="#E2E8F0"/>
      <polygon points="106,-3 108,1 110,-3" fill="#E2E8F0"/>
      <polygon points="114,-4 116,0 118,-4" fill="#E2E8F0"/>
      <polygon points="96,5 98,2 100,5" fill="#E2E8F0"/>
      <polygon points="104,4 106,1 108,4" fill="#E2E8F0"/>

      <!-- Great Crown Horns (Swept Back Gravel Slate Horns) -->
      <path d="M 72 -18 
               C 62 -32, 45 -42, 25 -48 
               C 42 -42, 58 -32, 75 -22 
               C 78 -20, 75 -19, 72 -18 Z" 
            fill="url(#gravelLight)" stroke="#1E293B" stroke-width="0.8"/>
      <!-- Green Arcane Runes etched on Horn -->
      <path d="M 45 -38 L 52 -33 M 58 -28 L 65 -23" stroke="#00FF88" stroke-width="1.3" stroke-linecap="round" filter="url(#subtleGlow)"/>

      <!-- Secondary Lower Horn -->
      <path d="M 68 -10 C 58 -18, 48 -24, 35 -26 C 46 -22, 56 -16, 70 -12 Z" fill="url(#gravelMid)"/>

      <!-- Piercing Emerald Dragon Eye -->
      <ellipse cx="86" cy="-10" rx="3.5" ry="2.2" transform="rotate(-15 86 -10)" fill="#00FF88" class="dragon-eye" filter="url(#greenGlow)"/>
      <ellipse cx="86" cy="-10" rx="1" ry="2" transform="rotate(-15 86 -10)" fill="#064E3B"/>
      <!-- Brow Ridge (Heavy Slate Brow) -->
      <path d="M 80 -14 C 85 -16, 92 -15, 95 -12" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

      <!-- Green Breath Wisps / Plasma Embers escaping from Snout -->
      <path d="M 120 -3 Q 135 -6 150 -4 Q 138 2 124 0 Z" fill="url(#trailGrad)" opacity="0.85" filter="url(#subtleGlow)"/>
      <circle cx="132" cy="-4" r="1.5" fill="#00FF88" class="ember-1" filter="url(#greenGlow)"/>
      <circle cx="145" cy="-2" r="1.2" fill="#34D399" class="ember-2"/>
      <circle cx="158" cy="-5" r="1" fill="#6EE7B7" class="ember-3"/>
    </g>

    <!-- FOREGROUND WING (Prominent Majestic Wing Beat) -->
    <g class="wing-front-group">
      <!-- Wing Membrane Panels (Rich Emerald to Dark Slate) -->
      <path d="M 22 4 
               C 15 -42, 5 -82, -10 -115 
               C 10 -98, 30 -78, 42 -55 
               C 58 -75, 78 -62, 90 -40 
               C 100 -52, 118 -38, 122 -18 
               C 95 -5, 60 2, 22 4 Z" 
            fill="url(#wingMembraneFront)"/>

      <!-- Bioluminescent Jade Wing Veins -->
      <path d="M 15 -45 Q 28 -70 42 -55" stroke="#00FF88" stroke-width="1.3" opacity="0.65" stroke-linecap="round"/>
      <path d="M 32 -30 Q 60 -52 90 -40" stroke="#00FF88" stroke-width="1.3" opacity="0.65" stroke-linecap="round"/>
      <path d="M 50 -15 Q 85 -30 122 -18" stroke="#00FF88" stroke-width="1.3" opacity="0.65" stroke-linecap="round"/>
      <path d="M 5 -75 Q 18 -82 30 -78" stroke="#34D399" stroke-width="0.9" opacity="0.55"/>

      <!-- Heavy Gravel Rock Skeletal Spars (Chiseled Granite Wing Bones) -->
      <path d="M 22 4 C 18 -35, 10 -75, -10 -115" stroke="url(#gravelLight)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M 20 4 C 16 -35, 8 -75, -12 -115" stroke="url(#gravelDark)" stroke-width="2" stroke-linecap="round"/>

      <!-- Finger Spar 1 -->
      <path d="M 5 -60 Q 25 -72 42 -55" stroke="url(#gravelMid)" stroke-width="3" stroke-linecap="round"/>
      <!-- Finger Spar 2 -->
      <path d="M 12 -38 Q 50 -55 90 -40" stroke="url(#gravelMid)" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Finger Spar 3 -->
      <path d="M 18 -18 Q 70 -30 122 -18" stroke="url(#gravelDark)" stroke-width="2.2" stroke-linecap="round"/>

      <!-- Wing Thumb and Finger Claws (Slate Claws with Jade Tips) -->
      <polygon points="-10,-115 -14,-122 -6,-117" fill="url(#gravelLight)"/>
      <polygon points="-14,-122 -16,-125 -13,-123" fill="#00FF88"/>
      <polygon points="42,-55 45,-60 40,-58" fill="url(#gravelLight)"/>
      <polygon points="90,-40 94,-44 89,-42" fill="url(#gravelLight)"/>
      <polygon points="122,-18 126,-21 121,-20" fill="url(#gravelLight)"/>
    </g>

  </g>
</svg>