<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070F"/>
      <stop offset="30%" stop-color="#0B0E24"/>
      <stop offset="70%" stop-color="#180B33"/>
      <stop offset="100%" stop-color="#05070F"/>
    </linearGradient>

    <!-- Nebula Glows -->
    <radialGradient id="cyanGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlow" cx="50%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#FF007A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect x="2" y="2" width="996" height="256" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Ambient Glow Spheres -->
  <rect x="2" y="2" width="996" height="256" rx="16" fill="url(#cyanGlow)"/>
  <rect x="2" y="2" width="996" height="256" rx="16" fill="url(#purpleGlow)"/>
  <rect x="2" y="2" width="996" height="256" rx="16" fill="url(#magentaGlow)"/>

  <!-- Subtle Quantum Grid Lines -->
  <g opacity="0.07" stroke="#00E5FF" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="260" stroke-dasharray="4 4"/>
    <line x1="200" y1="0" x2="200" y2="260" stroke-dasharray="4 4"/>
    <line x1="500" y1="0" x2="500" y2="260" stroke-dasharray="4 4"/>
    <line x1="800" y1="0" x2="800" y2="260" stroke-dasharray="4 4"/>
    <line x1="950" y1="0" x2="950" y2="260" stroke-dasharray="4 4"/>
    <line x1="0" y1="70" x2="1000" y2="70" stroke-dasharray="4 4"/>
    <line x1="0" y1="190" x2="1000" y2="190" stroke-dasharray="4 4"/>
  </g>

  <!-- Decorative Orbit Arc -->
  <path d="M 120,230 Q 500,-20 880,230" fill="none" stroke="url(#borderGrad)" stroke-width="1.2" opacity="0.2" stroke-dasharray="6 6"/>

  <!-- Top Pill / Status -->
  <g transform="translate(500, 48)">
    <rect x="-160" y="-14" width="320" height="28" rx="14" fill="#1E1B4B" fill-opacity="0.6" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="-138" cy="0" r="4" fill="#00E5FF" filter="url(#glow)"/>
    <text x="-124" y="4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#A5B4FC" letter-spacing="1.5">RESEARCHER &amp; SYSTEMS ARCHITECT</text>
  </g>

  <!-- Main Name Title -->
  <text x="500" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5" filter="url(#glow)">
    BODDU SARAN
  </text>

  <!-- Domain Tags -->
  <text x="500" y="174" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#F1F5F9" letter-spacing="0.5">
    <tspan fill="#00E5FF">⚛️ Quantum</tspan>
    <tspan fill="#64748B">  ·  </tspan>
    <tspan fill="#C084FC">🧬 Bio-AI</tspan>
    <tspan fill="#64748B">  ·  </tspan>
    <tspan fill="#38BDF8">🔭 Space Systems</tspan>
    <tspan fill="#64748B">  ·  </tspan>
    <tspan fill="#F472B6">🎨 Creative Tech</tspan>
  </text>

  <!-- Bottom Subtitle / Affiliation -->
  <text x="500" y="214" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#94A3B8" letter-spacing="1">
    RUNTIME SLAYERS RESEARCH COLLECTIVE  ·  AMRITA VISHWA VIDYAPEETHAM
  </text>

  <!-- Corner Quantum Accent Dots -->
  <circle cx="24" cy="24" r="2.5" fill="#00E5FF" opacity="0.7"/>
  <circle cx="36" cy="24" r="1.5" fill="#00E5FF" opacity="0.4"/>
  <circle cx="24" cy="36" r="1.5" fill="#00E5FF" opacity="0.4"/>
  
  <circle cx="976" cy="24" r="2.5" fill="#FF007A" opacity="0.7"/>
  <circle cx="964" cy="24" r="1.5" fill="#FF007A" opacity="0.4"/>
  <circle cx="976" cy="36" r="1.5" fill="#FF007A" opacity="0.4"/>

  <circle cx="24" cy="236" r="2.5" fill="#8B5CF6" opacity="0.7"/>
  <circle cx="976" cy="236" r="2.5" fill="#00E5FF" opacity="0.7"/>
</svg>